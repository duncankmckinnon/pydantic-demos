services:
  chat:
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    env_file: apps/chat/.env
    ports:
      - "8001:8000"
    profiles: ["chat", "all"]

  otel-collector-chat:
    image: otel/opentelemetry-collector-contrib:latest
    user: "0:0"
    volumes:
      - ./infra/otel-collector/chat.yaml:/etc/otelcol-contrib/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: apps/chat/.env
    profiles: ["chat", "all"]

  rx-assistant-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rx_assistant
      POSTGRES_PASSWORD: rx_assistant
      POSTGRES_DB: rx_assistant
    env_file: apps/rx-assistant/.env
    volumes:
      - rx_assistant_db_data:/var/lib/postgresql/data
      - ./apps/rx-assistant/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rx_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["rx-assistant", "all"]

  rx-assistant:
    build:
      context: .
      dockerfile: apps/rx-assistant/Dockerfile
    env_file: apps/rx-assistant/.env
    environment:
      DATABASE_URL: postgresql://rx_assistant:rx_assistant@rx-assistant-db:5432/rx_assistant
    volumes:
      - ./apps/rx-assistant/db-init/drugs.csv.gz:/app/apps/rx-assistant/db-init/drugs.csv.gz:ro
    depends_on:
      rx-assistant-db:
        condition: service_healthy
    ports:
      - "8002:8000"
    profiles: ["rx-assistant", "all"]

  rx-assistant-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    volumes:
      - ./apps/rx-assistant/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    env_file: apps/rx-assistant/.env
    depends_on:
      rx-assistant-db:
        condition: service_healthy
    profiles: ["rx-assistant", "all"]

  annotation-studio:
    # TEMPORARY (annotation-studio-queues branch): container_name, volume, and host port are
    # all overridden below so this branch's build never collides with or overwrites main's
    # running annotation-studio container/data — this branch is a breaking SQLite schema
    # change, so sharing main's `annotation_studio_data` volume would corrupt it. Revert this
    # block to main's version (container_name removed, `annotation_studio_data` volume,
    # "8003:8000" port) as part of merging this branch back.
    container_name: annotation-studio-queues-tmp
    build:
      context: .
      dockerfile: apps/annotation-studio/Dockerfile
    env_file: apps/annotation-studio/.env
    environment:
      ANNOTATION_STUDIO_DATABASE_PATH: /app/apps/annotation-studio/data/annotation_studio.sqlite3
    volumes:
      - annotation_studio_queues_tmp_data:/app/apps/annotation-studio/data
    ports:
      - "8013:8000"
    profiles: ["annotation-studio", "all"]

volumes:
  rx_assistant_db_data:
  annotation_studio_queues_tmp_data:
  annotation_studio_data:
