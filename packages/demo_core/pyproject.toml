[project]
name = "demo-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings",
    "logfire[fastapi,system-metrics]",
    "pydantic-ai",
    "pydantic-evals",
    "fastapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_core"]
