<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chat Demo</title>
    <style>
      :root {
        --bg: #f2f4f7;
        --card-bg: #ffffff;
        --border: #e2e5ea;
        --text: #1f2430;
        --muted: #6b7280;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --user-bubble: #4f46e5;
        --user-text: #ffffff;
        --agent-bubble: #eef0f4;
        --agent-text: #1f2430;
        --error-bubble: #fdecec;
        --error-text: #9f1c1c;
        --error-border: #f3b4b4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .chat-card {
        width: 100%;
        max-width: 640px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 8px 24px rgba(16, 24, 40, 0.06);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: min(720px, 85vh);
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border);
      }

      .chat-header h1 {
        font-size: 1.1rem;
        margin: 0;
      }

      #model-select {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.4rem 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }

      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .message {
        max-width: 75%;
        padding: 0.55rem 0.85rem;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.4;
        font-size: 0.95rem;
      }

      /* Agent replies are rendered from markdown (see renderMarkdown), so real HTML block
         elements handle spacing instead of the literal newlines white-space: pre-wrap
         preserves for the plain-text user/error bubbles. */
      .message.agent {
        white-space: normal;
      }

      .message.agent > :first-child {
        margin-top: 0;
      }

      .message.agent > :last-child {
        margin-bottom: 0;
      }

      .message.agent p,
      .message.agent ul,
      .message.agent ol,
      .message.agent blockquote,
      .message.agent table {
        margin: 0.5em 0;
      }

      .message.agent ul,
      .message.agent ol {
        padding-left: 1.4em;
      }

      .message.agent h1,
      .message.agent h2,
      .message.agent h3,
      .message.agent h4,
      .message.agent h5,
      .message.agent h6 {
        margin: 0.6em 0 0.3em;
        line-height: 1.3;
      }

      .message.agent code {
        background: rgba(0, 0, 0, 0.08);
        padding: 0.1em 0.3em;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
      }

      .message.agent pre {
        background: rgba(0, 0, 0, 0.08);
        padding: 0.6em 0.8em;
        border-radius: 8px;
        overflow-x: auto;
      }

      .message.agent pre code {
        background: none;
        padding: 0;
      }

      .message.agent blockquote {
        padding-left: 0.8em;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }

      .message.agent table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9em;
      }

      .message.agent th,
      .message.agent td {
        border: 1px solid var(--border);
        padding: 0.3em 0.6em;
        text-align: left;
      }

      .message.agent hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 0.8em 0;
      }

      .message.agent a {
        color: inherit;
      }

      .message.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: var(--user-text);
        border-bottom-right-radius: 4px;
      }

      .message.agent {
        align-self: flex-start;
        background: var(--agent-bubble);
        color: var(--agent-text);
        border-bottom-left-radius: 4px;
      }

      .message.agent.pending {
        color: var(--muted);
        font-style: italic;
      }

      .message.error {
        align-self: flex-start;
        background: var(--error-bubble);
        color: var(--error-text);
        border: 1px solid var(--error-border);
        border-bottom-left-radius: 4px;
      }

      #message-form {
        display: flex;
        gap: 0.6rem;
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--border);
      }

      #message-input {
        flex: 1;
        font: inherit;
        padding: 0.6rem 0.85rem;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      #message-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      #message-input:disabled,
      #model-select:disabled {
        opacity: 0.6;
      }

      button[type="submit"] {
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }

      button[type="submit"]:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="chat-card">
      <div class="chat-header">
        <h1>Chat Demo</h1>
        <select id="model-select">
          {% for api_format, model_name in model_choices %}
          <option value="{{ api_format }}:{{ model_name }}">{{ api_format }}:{{ model_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div id="transcript"></div>
      <form id="message-form">
        <input id="message-input" type="text" autocomplete="off" placeholder="Message the assistant…" />
        <button type="submit">Send</button>
      </form>
    </div>
    <script>
      const form = document.getElementById("message-form");
      const input = document.getElementById("message-input");
      const transcript = document.getElementById("transcript");
      const modelSelect = document.getElementById("model-select");
      const submitButton = form.querySelector("button[type=submit]");

      // Minimal, dependency-free markdown -> HTML renderer for agent replies (headings,
      // bold/italic/code, links, lists, blockquotes, tables, code fences, horizontal
      // rules). Escapes the raw text first — the source is LLM output, so this must not
      // let it inject arbitrary HTML.
      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function renderInline(text) {
        // Escaped here, per inline segment, rather than once over the whole raw string —
        // block-level detection below (blockquote >, etc.) needs to see the real
        // unescaped markdown characters first.
        text = escapeHtml(text);
        text = text.replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
        text = text.replace(
          /\[([^\]]+)\]\(([^)]+)\)/g,
          (_, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
        );
        text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
        text = text.replace(/(?<!_)_([^_]+)_(?!_)/g, "<em>$1</em>");
        return text;
      }

      function renderMarkdown(raw) {
        // Pull fenced code blocks out of the raw (unescaped) text first, so block-level
        // detection below never sees their contents; the extracted code is escaped when
        // re-inserted, further down.
        const codeBlocks = [];
        const withoutCode = raw.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
          codeBlocks.push(code.replace(/\n$/, ""));
          return ` CODEBLOCK${codeBlocks.length - 1} `;
        });

        const lines = withoutCode.split("\n");
        const html = [];
        let i = 0;
        const isBlockBoundary = (line) =>
          /^\s*$/.test(line) ||
          /^(#{1,6})\s+/.test(line) ||
          /^\s*[-*]\s+/.test(line) ||
          /^\s*\d+\.\s+/.test(line) ||
          /^\s*>\s?/.test(line) ||
          /^(-{3,}|\*{3,})\s*$/.test(line) ||
          /^ CODEBLOCK\d+ $/.test(line);

        while (i < lines.length) {
          const line = lines[i];

          if (/^\s*$/.test(line)) {
            i++;
            continue;
          }

          const codeMatch = line.match(/^ CODEBLOCK(\d+) $/);
          if (codeMatch) {
            html.push(`<pre><code>${escapeHtml(codeBlocks[Number(codeMatch[1])])}</code></pre>`);
            i++;
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.*)$/);
          if (heading) {
            const level = heading[1].length;
            html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
            i++;
            continue;
          }

          if (/^(-{3,}|\*{3,})\s*$/.test(line)) {
            html.push("<hr>");
            i++;
            continue;
          }

          if (/^\s*>\s?/.test(line)) {
            const quoteLines = [];
            while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
              quoteLines.push(lines[i].replace(/^\s*>\s?/, ""));
              i++;
            }
            html.push(`<blockquote>${renderInline(quoteLines.join(" "))}</blockquote>`);
            continue;
          }

          if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
            const parseRow = (row) =>
              row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
            const headerCells = parseRow(line);
            i += 2;
            const bodyRows = [];
            while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
              bodyRows.push(parseRow(lines[i]));
              i++;
            }
            const thead = `<thead><tr>${headerCells
              .map((cell) => `<th>${renderInline(cell)}</th>`)
              .join("")}</tr></thead>`;
            const tbody = `<tbody>${bodyRows
              .map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`)
              .join("")}</tbody>`;
            html.push(`<table>${thead}${tbody}</table>`);
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
              i++;
            }
            html.push(`<ul>${items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ul>`);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
              i++;
            }
            html.push(`<ol>${items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ol>`);
            continue;
          }

          const paragraphLines = [];
          while (i < lines.length && !isBlockBoundary(lines[i])) {
            paragraphLines.push(lines[i]);
            i++;
          }
          html.push(`<p>${renderInline(paragraphLines.join(" "))}</p>`);
        }

        return html.join("\n");
      }

      function addMessage(role, text, { pending = false } = {}) {
        const el = document.createElement("div");
        el.className = `message ${role}${pending ? " pending" : ""}`;
        if (role === "agent" && !pending) {
          el.innerHTML = renderMarkdown(text);
        } else {
          el.textContent = text;
        }
        transcript.appendChild(el);
        transcript.scrollTop = transcript.scrollHeight;
        return el;
      }

      function setBusy(busy) {
        input.disabled = busy;
        submitButton.disabled = busy;
      }

      async function postChat(message, modelChoice) {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, model_choice: modelChoice }),
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          const detail = data && data.detail ? data.detail : `Request failed (${response.status})`;
          throw new Error(detail);
        }
        return data;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage("user", message);
        input.value = "";
        setBusy(true);
        const pending = addMessage("agent", "…thinking", { pending: true });

        try {
          const data = await postChat(message, modelSelect.value);
          pending.innerHTML = renderMarkdown(data.reply);
          pending.classList.remove("pending");
        } catch (err) {
          pending.remove();
          addMessage("error", err.message || "Something went wrong.");
        } finally {
          setBusy(false);
          input.focus();
        }
      });
    </script>
  </body>
</html>
