[project]
name = "rx-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "demo-core",
    "pydantic-ai",
    "pydantic-evals",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-dotenv",
    "asyncpg",
    "pgvector",
    "sentence-transformers",
    "pydantic-ai-harness>=0.25.0",
    "httpx",
    # Direct (not just transitive via sentence-transformers) so the pytorch-cpu index
    # override below actually applies: uv only honors tool.uv.sources for direct
    # dependencies, not transitive ones.
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
demo-core = { workspace = true }
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rx_assistant"]
