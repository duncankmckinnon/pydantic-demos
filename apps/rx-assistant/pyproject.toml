[project]
name = "rx-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "demo-core",
    "pydantic-ai",
    "pydantic-evals",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-dotenv",
    "asyncpg",
    "pgvector",
    "sentence-transformers",
]

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rx_assistant"]
