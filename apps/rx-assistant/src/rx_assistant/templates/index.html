<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rx Assistant Demo</title>
    <style>
      :root {
        --bg: #f2f4f7;
        --card-bg: #ffffff;
        --border: #e2e5ea;
        --text: #1f2430;
        --muted: #6b7280;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --user-bubble: #4f46e5;
        --user-text: #ffffff;
        --agent-bubble: #eef0f4;
        --agent-text: #1f2430;
        --error-bubble: #fdecec;
        --error-text: #9f1c1c;
        --error-border: #f3b4b4;
        --disclaimer-bg: #fff3cd;
        --disclaimer-border: #ffe69c;
        --disclaimer-text: #7a5c00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .chat-card {
        width: 100%;
        max-width: 640px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 8px 24px rgba(16, 24, 40, 0.06);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: min(720px, 85vh);
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--border);
      }

      .chat-header h1 {
        font-size: 1.1rem;
        margin: 0;
      }

      #model-select {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.4rem 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }

      #disclaimer {
        background: var(--disclaimer-bg);
        border-bottom: 1px solid var(--disclaimer-border);
        color: var(--disclaimer-text);
        padding: 0.65rem 1.5rem;
        font-size: 0.8rem;
        line-height: 1.4;
      }

      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .message {
        max-width: 75%;
        padding: 0.55rem 0.85rem;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.4;
        font-size: 0.95rem;
      }

      .message.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: var(--user-text);
        border-bottom-right-radius: 4px;
      }

      .message.agent {
        align-self: flex-start;
        background: var(--agent-bubble);
        color: var(--agent-text);
        border-bottom-left-radius: 4px;
      }

      .message.agent.pending {
        color: var(--muted);
        font-style: italic;
      }

      .message.error {
        align-self: flex-start;
        background: var(--error-bubble);
        color: var(--error-text);
        border: 1px solid var(--error-border);
        border-bottom-left-radius: 4px;
      }

      #message-form {
        display: flex;
        gap: 0.6rem;
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--border);
      }

      #message-input {
        flex: 1;
        font: inherit;
        padding: 0.6rem 0.85rem;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      #message-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      #message-input:disabled,
      #model-select:disabled {
        opacity: 0.6;
      }

      button[type="submit"] {
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }

      button[type="submit"]:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="chat-card">
      <div class="chat-header">
        <h1>Rx Assistant Demo</h1>
        <select id="model-select">
          {% for api_format, model_name in model_choices %}
          <option value="{{ api_format }}:{{ model_name }}">{{ api_format }}:{{ model_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div id="disclaimer">
        This demo answers from a static, public dataset of medications and conditions.
        It is not medical advice — consult a healthcare professional for real decisions.
      </div>
      <div id="transcript"></div>
      <form id="message-form">
        <input id="message-input" type="text" autocomplete="off" placeholder="Ask about a condition or medication…" />
        <button type="submit">Send</button>
      </form>
    </div>
    <script>
      const form = document.getElementById("message-form");
      const input = document.getElementById("message-input");
      const transcript = document.getElementById("transcript");
      const modelSelect = document.getElementById("model-select");
      const submitButton = form.querySelector("button[type=submit]");

      function addMessage(role, text, { pending = false } = {}) {
        const el = document.createElement("div");
        el.className = `message ${role}${pending ? " pending" : ""}`;
        el.textContent = text;
        transcript.appendChild(el);
        transcript.scrollTop = transcript.scrollHeight;
        return el;
      }

      function setBusy(busy) {
        input.disabled = busy;
        submitButton.disabled = busy;
      }

      async function postChat(message, modelChoice) {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, model_choice: modelChoice }),
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          const detail = data && data.detail ? data.detail : `Request failed (${response.status})`;
          throw new Error(detail);
        }
        return data;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage("user", message);
        input.value = "";
        setBusy(true);
        const pending = addMessage("agent", "…thinking", { pending: true });

        try {
          const data = await postChat(message, modelSelect.value);
          pending.textContent = data.reply;
          pending.classList.remove("pending");
        } catch (err) {
          pending.remove();
          addMessage("error", err.message || "Something went wrong.");
        } finally {
          setBusy(false);
          input.focus();
        }
      });
    </script>
  </body>
</html>
