[project]
name = "audio-demo"
version = "0.1.0"
description = "Browser voice conversations with Pydantic AI Gateway and Logfire"
requires-python = ">=3.11"
dependencies = [
    "demo-core",
    "pydantic-ai>=2.42.0",
    "pydantic-ai-slim[realtime]>=2.42.0",
    "pydantic-evals>=2.42.0",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "logfire",
    "pydantic",
]

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_demo"]
