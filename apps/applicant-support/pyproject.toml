[project]
name = "applicant-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "demo-core",
    "logfire[variables,datasets]",
    "pydantic-ai",
    "pydantic-evals",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-dotenv",
]

[tool.uv.sources]
demo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applicant_support"]
