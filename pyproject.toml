[project]
name = "pydantic-demos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["demo-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
demo-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
