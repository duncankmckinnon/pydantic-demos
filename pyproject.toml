[project]
name = "pydantic-demos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib import mode keeps same-named test packages in different apps (apps/chat/tests
# and a future apps/<other>/tests) from colliding on the module name `tests.test_main`.
addopts = "--import-mode=importlib"
